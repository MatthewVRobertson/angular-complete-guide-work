<app-header></app-header>
<main>
  <ul id="users" >
    @for (user of users; track user.id) {
    <li>
      <app-user [user]="user" [isSelected]="user.id == selectedUserId" (select)="onSelectUser($event)"></app-user>
    </li>
    }
  </ul>
  @if (selectedUserId) {
    <app-tasks [selectedUser]="selectedUser"></app-tasks>
  }
  @else {
    <p id="fallback">Choose a user dawg</p>
  }
</main>
